# Render Blueprint for MGK DFBA devnet infrastructure (free tier, issue #17 amended)
# https://render.com/docs/blueprint-spec
#
# Services (the three existing free deploys):
#   mgk-indexer  — read-only sync/API (Node 22, no embedded writer)
#   mgk-keeper   — batch lifecycle cranker (Node 22 background worker)
#   mgk-oracle   — price oracle publisher (Node 22 background worker)
#
# Amended provisioning (user-approved, supersedes the paid tier in issue #17):
#   - Free plans, not Starter (~$21/mo). Free web services spin down after
#     ~15 min idle and share 750 free instance hours/month; background
#     workers may require Starter on some accounts. If Render rejects a free
#     worker, keep the same build/start commands on the existing free web
#     services and see docs/ops/provisioning-devnet-free.md.
#   - While a worker is asleep the 10 s oracle cadence, 2 s keeper poll and
#     the 2 h soak cannot be proven. Gate rows that need an awake window are
#     run awake or marked not-run; they are never silently passed.
#   - One RPC provider (the existing Helius account), a separate API key per
#     service, `confirmed` commitment everywhere. Each RPC_URL below is set
#     in the Render dashboard with that service's own key; never commit URLs.
#   - Addresses come from deployments/devnet.json (the manifest) after the
#     issue #38 deploy. The current batch is always derived from the
#     registry counter, never configured (no BATCH_ADDRESS).
#
# ⚠️  Keepers and oracles have autoDeploy: false to prevent uncontrolled cutovers.

services:
  # -----------------------------------------------------------------------
  # Indexer — read-only sync/API service
  # -----------------------------------------------------------------------
  - name: mgk-indexer
    type: web
    runtime: node
    plan: free
    region: oregon
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RPC_URL
        sync: false  # dashboard only: this service's own RPC API key
      - key: CORE_PROGRAM_ID
        value: "9gr1GDrBF8MQMGSsbHYnUMTkvpzNLANiP5ZHhDKKAaDT"
      - key: MATCHER_PROGRAM_ID
        value: "68MQqdugxZQA2F8GahhWZEusPnHbrfAXjqq2V9VCz8tK"
      - key: REGISTRY_ADDRESS
        sync: false  # from deployments/devnet.json after the #38 deploy
      - key: BOOK_ADDRESS
        sync: false  # from deployments/devnet.json after the #38 deploy
      # Free plans have no persistent disk: the SQLite DB is ephemeral and
      # the indexer replays from the manifest start slot after a cold start
      # (spec: full replay on an empty disk).
      - key: DB_PATH
        value: "/tmp/mgk-indexer.db"
      - key: PORT
        value: "4000"
      - key: LOG_LEVEL
        value: "info"
    buildCommand: cd mgk-frontend && pnpm install --filter @mgk/indexer --frozen-lockfile && pnpm -F @mgk/indexer build
    startCommand: cd mgk-frontend && node apps/indexer/dist/main.js

  # -----------------------------------------------------------------------
  # Keeper — batch lifecycle background worker (no HTTP server)
  # -----------------------------------------------------------------------
  - name: mgk-keeper
    type: worker
    runtime: node
    plan: free
    region: oregon
    autoDeploy: false  # manual cutover only
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RPC_URL
        sync: false  # dashboard only: keeper's own RPC API key
      - key: KEEPER_KEYPAIR
        sync: false  # mounted as Render secret file; keeper fee payer key only
      - key: BOOK_ADDRESS
        sync: false  # from deployments/devnet.json after the #38 deploy
      - key: PORTFOLIO_ADDRESSES
        value: ""  # optional; keeper discovers dynamically
      - key: INTERVAL
        value: "5000"
      - key: MAX_CONSECUTIVE_ERRORS
        value: "5"
      - key: LOG_LEVEL
        value: "info"
    buildCommand: cd tools && npm install @solana/web3.js
    startCommand: node tools/ops-keeper.js --loop --interval 5000

  # -----------------------------------------------------------------------
  # Oracle — price oracle background worker (no HTTP server)
  # -----------------------------------------------------------------------
  - name: mgk-oracle
    type: worker
    runtime: node
    plan: free
    region: oregon
    autoDeploy: false  # manual cutover only
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RPC_URL
        sync: false  # dashboard only: oracle's own RPC API key
      - key: ORACLE_AUTHORITY_KEYPAIR
        sync: false  # mounted as Render secret file; oracle authority key only
      - key: PRICE_ORACLE_ADDRESS
        sync: false  # from deployments/devnet.json after the #38 deploy
      - key: INSTRUMENT_ADDRESS
        sync: false  # from deployments/devnet.json after the #38 deploy
      - key: ORACLE_PROGRAM_ID
        value: "GLAu9n48oqnVRKHNoqfpek3kZyGUJTJRPQKo7mF3qWmm"
      # Only venues the worker implements (tools/ops-oracle.js). The spec
      # names Pyth Hermes / Coinbase / Kraken; that mismatch is a Checkpoint
      # B item, not something provisioning can fix by editing this value.
      - key: QUORUM_VENUES
        value: "binance,okx,bybit"
      - key: ORACLE_LOOP_INTERVAL
        value: "10000"
      - key: MAX_FRESHNESS_SEC
        value: "30"
      - key: MAX_DEVIATION_BPS
        value: "50"
      - key: LOG_LEVEL
        value: "info"
    buildCommand: cd tools && npm install @solana/web3.js
    startCommand: node tools/ops-oracle.js --loop
