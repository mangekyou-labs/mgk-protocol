name: mgk-frontend CI

on:
  push:
    branches: [master]
    paths:
      - 'mgk-frontend/**'
      - 'programs/**'
      - 'deployments/**'
      - 'tools/**'
      - 'scripts/check-layouts.sh'
      - '.github/workflows/mgk-frontend-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'mgk-frontend/**'
      - 'programs/**'
      - 'deployments/**'
      - 'tools/**'
      - 'scripts/check-layouts.sh'
      - '.github/workflows/mgk-frontend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mgk-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mgk-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npm install --prefix ../tools --ignore-scripts --package-lock=false
      - run: npm test --prefix ../tools
      - run: pnpm -F @mgk/layout test
      - run: pnpm -F @mgk/sdk test
      - run: pnpm -F @mgk/sdk build
      - run: pnpm -F indexer typecheck
      - run: pnpm -F indexer test
      - run: pnpm -F web typecheck
      - run: pnpm -F web lint
      - run: pnpm -F web test
      - run: pnpm -F web build
      - name: Install Chromium and system dependencies
        run: pnpm -F web exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm -F web e2e
        env:
          NEXT_PUBLIC_RPC_URL: ${{ secrets.DEVNET_RPC_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: mgk-frontend/apps/web/test-results/
          retention-days: 7

  layout-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: scripts/check-layouts.sh
